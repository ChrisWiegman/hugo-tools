name: Run Tests on Individual Scripts

on:
    push:
        paths:
            - "src/book.mjs"
            - "src/book.test.mjs"

concurrency:
    group: ${{ github.workflow }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Set up Node
              uses: actions/setup-node@v6
              with:
                  node-version: "lts/*"
                  cache: "npm"

            - name: Run book script tests
              run: npm run test
